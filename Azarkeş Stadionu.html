<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Azarkeş Stadionu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>
/* Layout: tam ekran 3B sahne; üstdə hesab lövhəsi, altda axtarış və son gələnlər xətti.
   Tək gecə görünüşü seçilib; bütün rənglər aşağıdakı tokenlərdən gəlir. */
:root{
  --bg:#070b16;
  --panel:rgba(9,13,22,.84);
  --panel-solid:#0d1320;
  --fg:#f3f5f9;
  --muted:#9ba7bd;
  --line:rgba(255,255,255,.14);
  --red:#e8303d;
  --green:#3da43b;
  --blue:#00b5e2;
  --gold:#f5c451;
  --paper:#ffffff;
  --ink:#0a0f1a;
  --f-display:'Barlow Condensed','Arial Narrow','Roboto Condensed',system-ui,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:500 15px/1.35 var(--f-body);overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;overflow:hidden;background:var(--bg)}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#tags{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.tag{position:absolute;left:0;top:0;font:600 13px/1.2 var(--f-body);color:#fff;background:rgba(10,15,26,.7);padding:2px 8px;border-radius:999px;white-space:nowrap;will-change:transform}
.tag.me{background:var(--gold);color:var(--ink);font-weight:800}
.tag.focus{background:#7fd6ff;color:var(--ink);font-weight:800}

.ui{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;gap:8px;pointer-events:none;
  padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
.top,.bottom{display:flex;pointer-events:none}
.top{justify-content:space-between;align-items:flex-start;gap:8px}
.bottom{flex-direction:column;gap:8px}
.top>*,.bottom>*,.side>*{pointer-events:auto}

.score{display:flex;flex-direction:column;gap:4px;min-width:0}
.big{display:flex;align-items:baseline;gap:8px;background:var(--panel);padding:6px 22px 6px 12px;clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%);backdrop-filter:blur(6px);white-space:nowrap}
.num{font:800 clamp(40px,13vw,58px)/1 var(--f-display);letter-spacing:.01em;font-variant-numeric:tabular-nums}
.cap{font:700 clamp(18px,5vw,24px)/1 var(--f-display);color:var(--muted);font-variant-numeric:tabular-nums}
.row2{display:flex;align-items:stretch}
.lbl{display:flex;align-items:center;gap:8px;background:var(--panel);padding:5px 12px;font:700 18px/1 var(--f-display);letter-spacing:.08em;backdrop-filter:blur(6px)}
.lbl i{display:block;width:16px;height:12px;background:var(--red);transform:skewX(-18deg)}
.pct{background:var(--paper);color:var(--ink);font:800 20px/1 var(--f-display);padding:6px 12px;font-variant-numeric:tabular-nums}
.sub{background:var(--panel);color:var(--muted);font-size:12.5px;padding:3px 10px;align-self:flex-start;max-width:min(78vw,380px);backdrop-filter:blur(6px)}
.pill{display:flex;align-items:center;gap:8px;background:var(--paper);color:var(--red);font:800 16px/1 var(--f-display);letter-spacing:.14em;padding:10px 14px 10px 22px;clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%);flex:none}
.pill i{width:10px;height:10px;border-radius:50%;background:var(--red)}

.side{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px;pointer-events:none}
.sq{width:56px;height:56px;border-radius:18px;border:1px solid var(--line);background:var(--panel-solid);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}

.hint{background:var(--panel-solid);border:1px solid var(--line);border-radius:18px;padding:10px 14px;text-align:center;color:var(--muted);font-size:14px;line-height:1.45}
.hint b{color:var(--fg);font-weight:700}
.toast{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel-solid);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.toast>div:first-child{min-width:0}
.toast .t1{font:700 20px/1.1 var(--f-display);letter-spacing:.02em;overflow-wrap:anywhere}
.toast .t2{color:var(--muted);font-size:14px;margin-top:2px}
.toast button{flex:none;border:0;border-radius:10px;background:var(--gold);color:var(--ink);font:700 15px var(--f-body);padding:9px 12px;cursor:pointer}
.chips{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);border-radius:16px;background:var(--panel-solid);color:#fff;font:700 17px/1 var(--f-body);padding:15px 18px;cursor:pointer}
.chip.red{background:var(--red);border-color:var(--red)}
.chip.green{background:var(--green);border-color:var(--green);color:#fff}
.chip[aria-pressed="true"]:not(.green){border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.chip.green[aria-pressed="true"]{box-shadow:0 0 0 2px var(--paper)}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.search{display:flex;align-items:stretch;height:56px;background:var(--panel-solid)}
.slabel{display:flex;align-items:center;background:var(--paper);color:var(--ink);font:800 clamp(15px,4.6vw,20px)/1 var(--f-display);letter-spacing:.12em;padding:0 24px 0 14px;clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%);white-space:nowrap;flex:none}
.search input{flex:1;min-width:0;background:transparent;border:0;color:#fff;font:700 20px var(--f-display);padding:0 12px;letter-spacing:.01em}
.search input::placeholder{color:#5f6b82}
.go{border:0;background:var(--red);color:#fff;font:800 22px/1 var(--f-display);letter-spacing:.14em;padding:0 20px;cursor:pointer;flex:none}

.ticker{display:flex;height:44px;background:#05080f;border-top:2px solid var(--red);overflow:hidden}
.tlabel{flex:none;display:flex;align-items:center;background:var(--red);color:#fff;font:800 clamp(14px,4.2vw,19px)/1 var(--f-display);letter-spacing:.12em;padding:0 14px}
.tview{flex:1;min-width:0;overflow:hidden;display:flex;align-items:center}
.track{display:flex;width:max-content;animation:scroll 60s linear infinite}
.half{display:flex;flex:none}
.it{display:flex;align-items:center;gap:8px;padding:0 22px;white-space:nowrap;font:700 18px/1 var(--f-display)}
.it b{color:#fff}
.it .ar{color:var(--muted)}
.it em{font-style:normal;color:var(--gold)}
.it.note{color:var(--muted);font-weight:600}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.track{animation:none}.tview{overflow-x:auto}}

#fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:var(--bg);z-index:5;font-size:17px}
</style>

<div id="app">

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script id="main">
(function(){
'use strict';
const $=id=>document.getElementById(id);
const fallback=$('fallback');
let booted=false;
function fail(m){fallback.hidden=false;fallback.textContent=m;}
window.addEventListener('error',function(e){if(!booted)fail('Xəta: '+(e&&e.message?e.message:'naməlum'));});
try{init();booted=true;}catch(err){fail('Xəta: '+(err&&err.message?err.message:String(err)));}

function init(){
if(typeof THREE==='undefined'){fail('3B kitabxana yüklənmədi. İnterneti yoxla və səhifəni yenilə.');return;}
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});}catch(e){fail('Bu cihaz 3B görüntünü aça bilmədi.');return;}
const stage=$('stage'),tagsEl=$('tags');
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.6));
stage.appendChild(renderer.domElement);
const canvas=renderer.domElement;
const reduceMotion=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const TAU=Math.PI*2;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rng=mulberry32(1905);

/* ---------- sahnə ---------- */
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x070b16);
scene.fog=new THREE.FogExp2(0x070b16,0.0011);
const camera=new THREE.PerspectiveCamera(55,1,0.4,2200);
scene.add(new THREE.HemisphereLight(0xa8bde8,0x232c3d,1.15));
const sun=new THREE.DirectionalLight(0xdfe8ff,0.5);
sun.position.set(-80,160,100);
scene.add(sun);
[[-45,48,0],[45,48,0]].forEach(function(p){
  const l=new THREE.PointLight(0xfff1dc,0.95,230,1.2);l.position.set(p[0],p[1],p[2]);scene.add(l);
});
const warm=new THREE.PointLight(0xffd7a0,1.1,110,1.2);warm.position.set(158,10,0);scene.add(warm);
function resize(){
  const w=stage.clientWidth||1,h=stage.clientHeight||1;
  renderer.setSize(w,h,false);
  camera.aspect=w/h;
  camera.updateProjectionMatrix();
}
if(window.ResizeObserver){new ResizeObserver(resize).observe(stage);}
window.addEventListener('resize',resize);
resize();

/* ---------- ölçülər (metr) ---------- */
const A0=96,B0=56;          // ilk sıranın ellipsi
const R=30,STEP=0.8,RISE=0.55,Y0=0.9,SECT=32;
const rowA=r=>A0+STEP*r,rowB=r=>B0+STEP*r,rowY=r=>Y0+RISE*r;
const TOPY=rowY(R-1);
const ROOF_IN=[102,62,25],ROOF_MID=[118,78,32],ROOF_OUT=[134,94,17];

/* ---------- yardımçılar ---------- */
const rgb=h=>{const c=new THREE.Color(h);return [c.r,c.g,c.b];};
function ringStrip(parts,N){
  const pos=[],col=[];
  for(let q=0;q<parts.length;q++){
    const p=parts[q];
    for(let i=0;i<N;i++){
      const t0=i/N*TAU,t1=(i+1)/N*TAU;
      const c0=Math.cos(t0),s0=Math.sin(t0),c1=Math.cos(t1),s1=Math.sin(t1);
      const ax=p.a0*c0,az=p.b0*s0,bx=p.a0*c1,bz=p.b0*s1,cx=p.a1*c0,cz=p.b1*s0,dx=p.a1*c1,dz=p.b1*s1;
      const c=typeof p.col==='function'?p.col(i):p.col;
      pos.push(ax,p.y0,az,bx,p.y0,bz,dx,p.y1,dz,ax,p.y0,az,dx,p.y1,dz,cx,p.y1,cz);
      for(let k=0;k<6;k++)col.push(c[0],c[1],c[2]);
    }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  g.computeVertexNormals();
  return g;
}
function mergeBoxes(list){
  const pos=[],nor=[],col=[];let colored=false;
  for(let q=0;q<list.length;q++){
    const b=list[q],cc=b[6];
    if(cc)colored=true;
    const g=new THREE.BoxGeometry(b[0],b[1],b[2]).toNonIndexed();
    g.translate(b[3],b[4],b[5]);
    const p=g.attributes.position.array,n=g.attributes.normal.array;
    for(let i=0;i<p.length;i++){pos.push(p[i]);nor.push(n[i]);}
    for(let k=0;k<p.length/3;k++){if(cc)col.push(cc[0],cc[1],cc[2]);else col.push(1,1,1);}
  }
  const G=new THREE.BufferGeometry();
  G.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  G.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
  if(colored)G.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  return G;
}
function glowTexture(){
  const c=document.createElement('canvas');c.width=c.height=64;
  const g=c.getContext('2d');
  const gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(0.25,'rgba(255,255,255,.55)');gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr;g.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(c);
}
const GLOW=glowTexture();
function glowPoints(arr,size,color,opacity){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(arr,3));
  const m=new THREE.Points(g,new THREE.PointsMaterial({map:GLOW,size:size,color:color,transparent:true,opacity:opacity===undefined?1:opacity,depthWrite:false,blending:THREE.AdditiveBlending,sizeAttenuation:true}));
  m.frustumCulled=false;scene.add(m);return m;
}
const ep=(a,b,y,t)=>[a*Math.cos(t),y,b*Math.sin(t)];
const updaters=[];
const personBodyGeo=mergeBoxes([[0.34,0.8,0.24,0,0.4,0,[0.12,0.14,0.22]],[0.46,0.62,0.28,0,1.11,0]]);
const personHeadGeo=mergeBoxes([[0.22,0.22,0.22,0,1.55,0]]);

/* ---------- yer, şəhər, ulduzlar ---------- */
const groundMesh=new THREE.Mesh(new THREE.PlaneGeometry(2600,2600),new THREE.MeshLambertMaterial({color:0x0a0f15}));
groundMesh.rotation.x=-Math.PI/2;groundMesh.position.y=-0.1;scene.add(groundMesh);
(function plaza(){
  const sh=new THREE.Shape();
  for(let i=0;i<=160;i++){const t=i/160*TAU;const x=178*Math.cos(t),y=138*Math.sin(t);if(i===0)sh.moveTo(x,y);else sh.lineTo(x,y);}
  const g=new THREE.ShapeGeometry(sh);g.rotateX(-Math.PI/2);
  const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({color:0x1a212c}));m.position.y=0.02;scene.add(m);
})();
(function stars(){
  const p=[];
  for(let i=0;i<360;i++){
    const u=rng()*TAU,v=0.12+rng()*1.3,r=1500;
    p.push(r*Math.cos(u)*Math.cos(v),r*Math.sin(v),r*Math.sin(u)*Math.cos(v));
  }
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));
  const m=new THREE.Points(g,new THREE.PointsMaterial({color:0xcfd9ff,size:2.2,sizeAttenuation:false,fog:false,transparent:true,opacity:0.8}));
  m.frustumCulled=false;scene.add(m);
})();
(function trees(){
  const cone=new THREE.ConeGeometry(3.2,10,6);cone.translate(0,7,0);
  const N=320,mesh=new THREE.InstancedMesh(cone,new THREE.MeshLambertMaterial({color:0xffffff}),N);
  const d=new THREE.Object3D(),col=new THREE.Color();
  let n=0,guard=0;
  while(n<N&&guard++<6000){
    const x=(rng()-0.5)*900,z=(rng()-0.5)*760;
    if(Math.abs(x)<350&&Math.abs(z)<260)continue;   // yollar, dayanacaqlar və binalar üçün yer
    if(Math.abs(z)<16)continue;                      // magistral yol
    const s=0.8+rng()*0.9;
    d.position.set(x,0,z);d.scale.set(s,s,s);d.updateMatrix();
    mesh.setMatrixAt(n,d.matrix);mesh.setColorAt(n,col.setHSL(0.34+rng()*0.05,0.5,0.12+rng()*0.08));
    n++;
  }
  mesh.count=n;mesh.frustumCulled=false;scene.add(mesh);
  // küçə işıqları
  const lp=[],ln=[];
  for(let i=0;i<72;i++){
    const t=i/72*TAU,x=168*Math.cos(t),z=128*Math.sin(t);
    lp.push(x,8,z);ln.push(x,0,z,x,8,z);
  }
  glowPoints(lp,9,0xffe2a8,0.9);
  const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(ln,3));
  scene.add(new THREE.LineSegments(lg,new THREE.LineBasicMaterial({color:0x4a5366})));
})();

/* ---------- saha və qaçış yolu ---------- */
(function field(){
  const S=10,W=192*S,H=112*S;
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const c=cv.getContext('2d');
  const X=x=>(x+96)*S,Z=z=>(z+56)*S;
  c.fillStyle='#464c58';c.fillRect(0,0,W,H);
  const L=42.2;
  function stadium(r){
    c.beginPath();
    c.moveTo(X(-L),Z(-r));c.lineTo(X(L),Z(-r));
    c.arc(X(L),Z(0),r*S,-Math.PI/2,Math.PI/2,false);
    c.lineTo(X(-L),Z(r));
    c.arc(X(-L),Z(0),r*S,Math.PI/2,Math.PI*1.5,false);
    c.closePath();
  }
  stadium(47.6);c.fillStyle='#2e7a3d';c.fill();
  stadium(46.3);c.fillStyle='#bf4f3a';c.fill();
  stadium(36.5);c.fillStyle='#276f3a';c.fill();
  c.strokeStyle='rgba(255,255,255,.7)';c.lineWidth=1;
  for(let k=1;k<=7;k++){stadium(36.5+k*1.22);c.stroke();}
  c.lineWidth=3;stadium(36.5);c.stroke();
  // futbol meydançası
  const px0=-52.5,pz0=-34;
  for(let i=0;i<15;i++){c.fillStyle=i%2?'#2a8444':'#2e8e49';c.fillRect(X(px0+i*7),Z(pz0),7*S+1,68*S);}
  c.strokeStyle='rgba(255,255,255,.95)';c.fillStyle='rgba(255,255,255,.95)';c.lineWidth=3;
  c.strokeRect(X(-52.5),Z(-34),105*S,68*S);
  c.beginPath();c.moveTo(X(0),Z(-34));c.lineTo(X(0),Z(34));c.stroke();
  c.beginPath();c.arc(X(0),Z(0),9.15*S,0,TAU);c.stroke();
  c.beginPath();c.arc(X(0),Z(0),0.4*S,0,TAU);c.fill();
  [-1,1].forEach(function(s){
    const gx=s*52.5;

const standOf=t=>{

(function buildSeats(){
  const M=2000;

    const a=rowA(r),b=rowB(r),y=rowY(r);
    const px=new Float32Array(M+1),pz=new Float32Array(M+1),cum=new Float32Array(M+1);
    for(let i=0;i<=M;i++){
      const t=i/M*TAU;px[i]=a*Math.cos(t);pz[i]=b*Math.sin(t);
      cum[i]=i?cum[i-1]+Math.hypot(px[i]-px[i-1],pz[i]-pz[i-1]):0;
    }
    const L=cum[M],count=Math.floor(L/0.5),step=L/count;
    const secCount=new Array(SECT).fill(0);
    let j=0;
    for(let k=0;k<count;k++){
      const dd=(k+0.5)*step;
      while(j<M-1&&cum[j+1]<dd)j++;
      const f=(dd-cum[j])/(cum[j+1]-cum[j]);
      const x=px[j]+(px[j+1]-px[j])*f,z=pz[j]+(pz[j+1]-pz[j])*f;
      const t=(j+f)/M*TAU;

      sphA.push(Math.atan2(nx,nz));

/* ---------- kamera ---------- */
const cam={theta:Math.PI/2+0.4,elev:0.6,r:330,tx:0,ty:0,tz:0};
const goal=Object.assign({},cam);
let flying=false;
const angDiff=(a,b)=>((a-b+Math.PI)%TAU+TAU)%TAU-Math.PI;
function clampCam(){
  cam.elev=clamp(cam.elev,0.05,1.45);
  cam.r=clamp(cam.r,4,620);
  cam.ty=clamp(cam.ty,0,26);
  const m=Math.hypot(cam.tx,cam.tz);
  if(m>260){cam.tx*=260/m;cam.tz*=260/m;}
}
function applyCam(){
  const ce=Math.cos(cam.elev);
  camera.position.set(cam.tx+cam.r*ce*Math.sin(cam.theta),cam.ty+cam.r*Math.sin(cam.elev),cam.tz+cam.r*ce*Math.cos(cam.theta));
  camera.lookAt(cam.tx,cam.ty,cam.tz);
}
function startFly(p){
  Object.assign(goal,cam);Object.assign(goal,p);
  if(p.theta!==undefined)goal.theta=cam.theta+angDiff(p.theta,cam.theta);
  flying=true;
}
function stepCam(dt){
  if(!flying)return;
  const k=1-Math.pow(0.0006,dt);
  ['theta','elev','r','tx','ty','tz'].forEach(function(f){cam[f]+=(goal[f]-cam[f])*k;});
  if(Math.abs(goal.r-cam.r)<0.05&&Math.abs(goal.theta-cam.theta)<0.002&&Math.abs(goal.tx-cam.tx)<0.05&&Math.abs(goal.tz-cam.tz)<0.05&&Math.abs(goal.ty-cam.ty)<0.05){
    Object.assign(cam,goal);flying=false;
  }
}

function pan(dx,dy){
  const sc=cam.r*0.0016,st=Math.sin(cam.theta),ct=Math.cos(cam.theta);
  cam.tx-=ct*dx*sc;cam.tz+=st*dx*sc;
  cam.tx+=-st*dy*sc;cam.tz+=-ct*dy*sc;
  clampCam();
}

const hint=$('hint');

const ptrs=new Map();

  try{canvas.setPointerCapture(e.pointerId);}catch(err){}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  tapRec={x:e.clientX,y:e.clientY,t:performance.now(),moved:ptrs.size>1};
  flying=false;hideHint();

});
canvas.addEventListener('pointermove',function(e){
  const p=ptrs.get(e.pointerId);

  const dx=e.clientX-p.x,dy=e.clientY-p.y;
  p.x=e.clientX;p.y=e.clientY;
  if(tapRec&&Math.hypot(e.clientX-tapRec.x,e.clientY-tapRec.y)>8)tapRec.moved=true;
  if(ptrs.size===1){
    if(e.pointerType==='mouse'&&(e.buttons&2)){pan(dx,dy);}
    else{cam.theta-=dx*0.006;cam.elev+=dy*0.005;clampCam();}
  }else if(ptrs.size===2){
    const a=Array.from(ptrs.values()),d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),mx=(a[0].x+a[1].x)/2,my=(a[0].y+a[1].y)/2;
    if(gest){cam.r*=gest.d/Math.max(d,1);pan(mx-gest.mx,my-gest.my);}
    gest={d:d,mx:mx,my:my};

  }
});
function endPtr(e,cancel){
  if(!ptrs.has(e.pointerId))return;
  const wasOne=ptrs.size===1;
  ptrs.delete(e.pointerId);
  if(ptrs.size<2)gest=null;
  if(!cancel&&wasOne&&tapRec&&!tapRec.moved&&performance.now()-tapRec.t<400)handleTap(e.clientX,e.clientY);

function pickSeat(x,y){
  const r=canvas.getBoundingClientRect();
  ndc.set(((x-r.left)/r.width)*2-1,-((y-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera);
  const o=ray.ray.origin,d=ray.ray.direction;
  let best=-1,bt=1e9;
  for(let i=0;i<NS;i++){
    const wx=sx[i]-o.x,wy=sy[i]+0.6-o.y,wz=sz[i]-o.z;
    const t=wx*d.x+wy*d.y+wz*d.z;
    if(t<=0||t>=bt)continue;
    const d2=wx*wx+wy*wy+wz*wz-t*t,tol=0.45+t*0.018;
    if(d2<tol*tol){bt=t;best=i;}
  }
  return best;
}
function handleTap(x,y){

  lastTap={t:now,x:x,y:y};

  if(dbl){
    if(si>=0){flyToSeat(si);return;}
    const r=canvas.getBoundingClientRect();
    ndc.set(((x-r.left)/r.width)*2-1,-((y-r.top)/r.height)*2+1);
    ray.setFromCamera(ndc,camera);
    const pt=new THREE.Vector3();
    if(ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),-cam.ty),pt))startFly({tx:pt.x,tz:pt.z,r:Math.max(20,cam.r*0.5)});
    return;
  }
  if(si>=0)describeSeat(si);
}

/* ---------- yazılar, etiketlər ---------- */
function makeTag(cls){const d=document.createElement('div');d.className='tag'+(cls?' '+cls:'');d.hidden=true;tagsEl.appendChild(d);return d;}
const tagMine=makeTag('me'),tagFocus=makeTag('focus');
const pool=[];for(let i=0;i<14;i++)pool.push(makeTag(''));
const pv=new THREE.Vector3(),dirV=new THREE.Vector3();
let focusSeat=-1,focusUntil=0,nearList=[],frameNo=0;
function placeTag(el,x,y,z,lift){
  pv.set(x,y+lift,z).project(camera);
  const w=stage.clientWidth,h=stage.clientHeight;
  const px=(pv.x*0.5+0.5)*w,py=(-pv.y*0.5+0.5)*h;
  if(pv.z>1||pv.z<-1||px<-40||px>w+40||py<-20||py>h+20){el.hidden=true;return;}
  el.hidden=false;
  el.style.transform='translate('+px.toFixed(1)+'px,'+py.toFixed(1)+'px) translate(-50%,-100%)';
}
function pickNear(){
  camera.getWorldDirection(dirV);
  const cp=camera.position,best=[];
  for(let i=0;i<reals.length;i++){
    const f=reals[i];
    if(f===mineF||f.seat===focusSeat)continue;
    const dx=sx[f.seat]-cp.x,dy=sy[f.seat]-cp.y,dz=sz[f.seat]-cp.z,dd=dx*dx+dy*dy+dz*dz;
    if(dd>3600||dx*dirV.x+dy*dirV.y+dz*dirV.z<=0)continue;
    best.push({d:dd,f:f});
  }
  best.sort((a,b)=>a.d-b.d);
  nearList=best.slice(0,pool.length).map(b=>b.f);
}
function updateTags(now){
  frameNo++;
  if(cam.r<70){if(frameNo%8===0)pickNear();}else nearList=[];
  for(let i=0;i<pool.length;i++){
    const el=pool[i];
    if(i<nearList.length){
      const f=nearList[i];
      if(el._f!==f){el._f=f;el.textContent='@'+f.name;}
      placeTag(el,sx[f.seat],sy[f.seat],sz[f.seat],1.5);
    }else el.hidden=true;
  }
  if(mineF&&cam.r<300){placeTag(tagMine,sx[mineF.seat],sy[mineF.seat],sz[mineF.seat],2.7);}else tagMine.hidden=true;
  if(focusSeat>=0&&now<focusUntil){placeTag(tagFocus,sx[focusSeat],sy[focusSeat],sz[focusSeat],1.9);}
  else{tagFocus.hidden=true;focusBeam.visible=false;}
}

/* ---------- işıq şousu ---------- */
const LN=3200;
const lightGeo=new THREE.BufferGeometry();
const lightPos=new Float32Array(LN*3),lightCol=new Float32Array(LN*3),lightT=new Float32Array(LN);
lightGeo.setAttribute('position',new THREE.BufferAttribute(lightPos,3));
lightGeo.setAttribute('color',new THREE.BufferAttribute(lightCol,3));
const lightPts=new THREE.Points(lightGeo,new THREE.PointsMaterial({map:GLOW,size:2.4,vertexColors:true,transparent:true,opacity:0.95,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}));
lightPts.visible=false;lightPts.frustumCulled=false;scene.add(lightPts);
let showOn=false,lastLight=0;
function fillLights(){
  for(let i=0;i<LN;i++){
    const si=instSeat[Math.floor(Math.random()*instSeat.length)];
    lightPos[i*3]=sx[si];lightPos[i*3+1]=sy[si]+1.3;lightPos[i*3+2]=sz[si];
    lightT[i]=(Math.atan2(sz[si],sx[si])+Math.PI)/TAU;
  }
  lightGeo.attributes.position.needsUpdate=true;
}
const SHOW=[[0,0.71,0.89],[0.91,0.19,0.24],[0.24,0.64,0.23],[1,1,1]];
function updateLights(t){
  for(let i=0;i<LN;i++){
    const k=Math.floor((lightT[i]*4+t*1.6))%4,c=SHOW[(k+4)%4];
    lightCol[i*3]=c[0];lightCol[i*3+1]=c[1];lightCol[i*3+2]=c[2];
  }
  lightGeo.attributes.color.needsUpdate=true;
}

/* ---------- interfeys ---------- */
function updateCounter(){
  const n=reals.length;
  $('num').textContent=fmt(n);
  $('cap').textContent='/ '+fmt(NS);
  $('pct').textContent='%'+(n/NS*100).toFixed(1).replace('.',',');
  $('sub').textContent=(serverOn?'Real azarkeşlər ümumi siyahıdan gəlir. ':'Server qoşulmayıb: yalnız sənin yerin bu cihazda saxlanır. ')+'Hərəkət edən adsız azarkeşlər, giriş növbəsi və işçilər nümunədir və sayıma daxil deyil.';
  drawScreen(n);
}
function renderTicker(){
  const track=$('track');track.textContent='';
  const items=reals.slice(-14).reverse();
  for(let c=0;c<2;c++){
    const half=document.createElement('div');half.className='half';
    if(!items.length){
      for(let k=0;k<3;k++){
        const s=document.createElement('span');s.className='it note';
        s.textContent='Hələ heç kim yer tutmayıb · ilk sən ol';
        half.appendChild(s);
      }
    }else{
      items.forEach(function(f){
        const s=document.createElement('span');s.className='it';
        const b=document.createElement('b');b.textContent='@'+f.name;
        const a=document.createElement('span');a.className='ar';a.textContent='→';
        const e=document.createElement('em');e.textContent=seatBlock(f.seat);
        s.append(b,a,e);half.appendChild(s);
      });
    }
    track.appendChild(half);
  }
  track.style.animationDuration=Math.max(30,(items.length||3)*6)+'s';
}
let toastTimer=0;
function showToast(t1,t2,actLabel,actFn){
  $('t1').textContent=t1;$('t2').textContent=t2||'';
  const b=$('tact');
  if(actLabel){b.textContent=actLabel;b.hidden=false;b.onclick=function(){actFn();};}else{b.hidden=true;b.onclick=null;}
  $('toast').hidden=false;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){$('toast').hidden=true;},actLabel?10000:7000);
}
const NAME_RE=/^[a-z0-9._]{1,30}$/;
const cleanName=v=>String(v||'').trim().replace(/^@+/,'').toLowerCase();
function readName(){
  const n=cleanName($('who').value);
  if(!n){showToast('İstifadəçi adını yaz','Aşağıdakı xanaya yaz, məsələn: @istifadeci_adin');$('who').focus();return null;}
  if(!NAME_RE.test(n)){showToast('İstifadəçi adı yararsızdır','Yalnız hərf, rəqəm, nöqtə və alt xətt ola bilər.');return null;}
  return n;
}
function describeSeat(si){
  const f=realBySeat.get(si),loc=seatLoc(si);
  if(f){showToast('@'+f.name,loc+(f.mine?' · sənin yerin':''));return;}
  const label=ambShirt[si]?'Nümunə azarkeş':'Boş yer';
  showToast(label,loc+(ambShirt[si]?' · bəzək üçündür, istifadəçi deyil':''),mineF?null:'Bura otur',function(){const n=readName();if(n)claim(n,si);});
}
function pickFreeSeat(){
  for(let a=0;a<200;a++){
    const i=Math.floor(Math.random()*NS);
    if(!realBySeat.has(i)&&srow[i]<22)return i;
  }
  for(let i=0;i<NS;i++)if(!realBySeat.has(i))return i;
  return -1;
}
async function claim(name,preferSeat){
  if(mineF){flyToSeat(mineF.seat);showToast('Sən artıq oturmusan','@'+mineF.name+' · '+seatLoc(mineF.seat));return;}
  if(nameMap.has(name)){const f=nameMap.get(name);flyToSeat(f.seat);showToast('@'+name+' artıq oturub',seatLoc(f.seat));return;}
  let si=(preferSeat===undefined||preferSeat===null)?pickFreeSeat():preferSeat;
  if(si<0||realBySeat.has(si)){si=pickFreeSeat();}
  if(si<0){showToast('Stadion doludur','Boş yer qalmayıb.');return;}
  if(serverOn){
    let ok=false;
    for(let a=0;a<3&&!ok;a++){
      let res;
      try{res=await apiClaim(name,si);}catch(e){showToast('Server cavab vermədi','Bir az sonra yenidən yoxla.');return;}
      if(res.status===200||res.status===201){ok=true;break;}
      if(res.status===409&&res.body&&res.body.error==='name_taken'){await apiLoad();const f=nameMap.get(name);if(f){flyToSeat(f.seat);showToast('@'+name+' artıq oturub',seatLoc(f.seat));}return;}
      if(res.status===409){await apiLoad();si=pickFreeSeat();if(si<0){showToast('Stadion doludur','Boş yer qalmayıb.');return;}continue;}
      showToast('Yer tutula bilmədi','Server xəta qaytardı ('+res.status+').');return;
    }
    if(!ok){showToast('Yer tutula bilmədi','Bir az sonra yenidən yoxla.');return;}
  }
  const f=addReal(name,si,true);
  if(!f)return;
  saveMine();updateCounter();renderTicker();
  if(showOn)fillLights();
  flyToSeat(si);
  showToast('@'+name+' yerini tutdu',seatLoc(si)+(serverOn?'':' · yalnız bu cihazda saxlanıldı'));
}
function find(name){
  const f=nameMap.get(name);
  if(!f){
    showToast('@'+name+' stadionda yoxdur','Bu adla yer tutmaq istəyirsən?',mineF?null:'Bu adla otur',function(){claim(name);});
    return;
  }
  flyToSeat(f.seat);
  if(!f.mine){
    focusSeat=f.seat;focusUntil=performance.now()+9000;
    focusBeam.position.set(sx[f.seat],sy[f.seat],sz[f.seat]);focusBeam.visible=true;
    tagFocus.textContent='@'+f.name;
  }
  showToast('@'+f.name,seatLoc(f.seat)+(f.mine?' · sənin yerin':''));
}
$('sform').addEventListener('submit',function(e){e.preventDefault();const n=readName();if(n)find(n);});
$('claim').addEventListener('click',function(){const n=readName();if(n)claim(n);});
$('release').addEventListener('click',function(){
  if(!mineF)return;
  const nm=mineF.name;removeMine();updateCounter();renderTicker();
  showToast('Yer buraxıldı','@'+nm+' artıq stadionda yoxdur.');
});
$('show').addEventListener('click',function(){
  showOn=!showOn;this.setAttribute('aria-pressed',String(showOn));
  lightPts.visible=showOn;
  if(showOn){fillLights();updateLights(performance.now()/1000);}
});
$('roof').addEventListener('click',function(){
  const on=this.getAttribute('aria-pressed')!=='true';
  this.setAttribute('aria-pressed',String(on));roofGroup.visible=on;
});
$('home').addEventListener('click',function(){startFly({tx:0,ty:0,tz:0,theta:Math.PI/2+0.4,elev:0.6,r:330});});
$('up').addEventListener('click',function(){hideHint();startFly({ty:clamp((flying?goal.ty:cam.ty)+3,0,26)});});
$('down').addEventListener('click',function(){hideHint();startFly({ty:clamp((flying?goal.ty:cam.ty)-3,0,26)});});

/* ---------- ortaq server (isteğe bağlı: /api/seats) ---------- */
async function apiLoad(){
  try{
    const r=await fetch('/api/seats',{cache:'no-store'});
    if(!r.ok)throw new Error('yox');
    const j=await r.json();
    if(!j||!Array.isArray(j.fans))throw new Error('format');
    serverOn=true;
    let added=false;
    j.fans.forEach(function(x){
      if(!x||typeof x.name!=='string'||!NAME_RE.test(x.name)||!Number.isInteger(x.seat)||x.seat<0||x.seat>=NS)return;
      const isMine=!!(mineF&&mineF.name===x.name);
      if(isMine||nameMap.has(x.name)||realBySeat.has(x.seat))return;
      if(addReal(x.name,x.seat,false))added=true;
    });
    $('release').hidden=true;
    if(added&&showOn)fillLights();
    updateCounter();renderTicker();
    return true;
  }catch(e){return false;}
}
async function apiClaim(name,seat){
  const r=await fetch('/api/seats',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:name,seat:seat})});
  let body=null;try{body=await r.json();}catch(e){}
  return {status:r.status,body:body};
}

/* ---------- yadda saxlanmış yer ---------- */
(function restore(){
  let saved=null;
  try{saved=JSON.parse(localStorage.getItem('azarkes-stadionu')||'null');}catch(e){}
  if(saved&&typeof saved.name==='string'&&NAME_RE.test(saved.name)&&Number.isInteger(saved.seat)&&saved.seat>=0&&saved.seat<NS){
    $('who').value='@'+saved.name;
    addReal(saved.name,saved.seat,true);
  }
  updateCounter();renderTicker();
  apiLoad();
  setInterval(function(){if(serverOn)apiLoad();},25000);
})();

/* ---------- dövr ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  timeU.value=now/1000;
  stepCam(dt);clampCam();applyCam();
  const pulse=reduceMotion?0.55:0.5+0.15*Math.sin(now/330);
  mineBeam.material.opacity=pulse;focusBeam.material.opacity=pulse;
  if(showOn&&now-lastLight>90&&!reduceMotion){lastLight=now;updateLights(now/1000);}
  const ts=reduceMotion?0:now/1000,dd=reduceMotion?0:dt;
  for(let u=0;u<updaters.length;u++)updaters[u](ts,dd);
  updateTags(now);
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
}
})();
